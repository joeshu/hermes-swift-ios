name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show available schemes
        run: xcodebuild -list -project Hermes_IOS.xcodeproj | tee build-schemes.log

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Hermes_IOS.xcodeproj | tee resolve-packages.log

      - name: Build app (simulator with logs)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project Hermes_IOS.xcodeproj \
            -scheme Hermes_IOS \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/xcodebuild-simulator.log

      - name: Archive app (unsigned, best effort)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project Hermes_IOS.xcodeproj \
            -scheme Hermes_IOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Hermes_IOS.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee build/xcodebuild-archive.log || true

      - name: Package Payload into unsigned IPA if app exists
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/Hermes_IOS.xcarchive -type d -name '*.app' | head -n 1 || true)
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            cp -R "$APP_PATH" build/Payload/
            cd build && zip -r Hermes_IOS-unsigned.ipa Payload >/dev/null
            echo "Created unsigned IPA artifact"
          else
            echo "No .app found in archive; skipping IPA packaging"
          fi

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ios-build-debug
          path: |
            build/**
            build-schemes.log
            resolve-packages.log
          if-no-files-found: warn
