name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show available schemes and SDKs
        run: |
          xcodebuild -list -project Hermes_IOS.xcodeproj | tee build-schemes.log
          xcodebuild -showsdks | tee build-sdks.log
          xcrun simctl list devices available | tee sim-devices.log

      - name: Detect scheme
        run: |
          python3 - <<'PY' > detected-scheme.txt
import re, subprocess
text = subprocess.check_output(['xcodebuild','-list','-project','Hermes_IOS.xcodeproj'], text=True)
lines = text.splitlines()
schemes = []
in_schemes = False
for line in lines:
    if line.strip() == 'Schemes:':
        in_schemes = True
        continue
    if in_schemes:
        if not line.strip():
            break
        schemes.append(line.strip())
print(schemes[0] if schemes else 'Hermes_IOS')
PY
          echo "SCHEME=$(cat detected-scheme.txt)" >> $GITHUB_ENV
          echo "Detected scheme: $(cat detected-scheme.txt)"

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Hermes_IOS.xcodeproj | tee resolve-packages.log

      - name: Build app (simulator with logs)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project Hermes_IOS.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/xcodebuild-simulator.log

      - name: Extract error summary
        if: failure()
        run: |
          grep -nE "error:|fatal error:|SwiftCompile|Command .* failed|BUILD FAILED|No such module|provision|sign" build/xcodebuild-simulator.log | tail -n 120 | tee build/error-summary.log || true

      - name: Archive app (unsigned, best effort)
        if: success()
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project Hermes_IOS.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Hermes_IOS.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee build/xcodebuild-archive.log || true

      - name: Package Payload into unsigned IPA if app exists
        if: success()
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/Hermes_IOS.xcarchive -type d -name '*.app' | head -n 1 || true)
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            cp -R "$APP_PATH" build/Payload/
            cd build && zip -r Hermes_IOS-unsigned.ipa Payload >/dev/null
            echo "Created unsigned IPA artifact"
          else
            echo "No .app found in archive; skipping IPA packaging"
          fi

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ios-build-debug
          path: |
            build/**
            build-schemes.log
            build-sdks.log
            sim-devices.log
            resolve-packages.log
            detected-scheme.txt
          if-no-files-found: warn
