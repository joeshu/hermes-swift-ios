name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Hermes_IOS.xcodeproj

      - name: Build app (simulator)
        run: |
          xcodebuild \
            -project Hermes_IOS.xcodeproj \
            -scheme Hermes_IOS \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive app (unsigned)
        run: |
          mkdir -p build
          xcodebuild \
            -project Hermes_IOS.xcodeproj \
            -scheme Hermes_IOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Hermes_IOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive || true

      - name: Package Payload into unsigned IPA if app exists
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/Hermes_IOS.xcarchive -type d -name '*.app' | head -n 1 || true)
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            cp -R "$APP_PATH" build/Payload/
            cd build && zip -r Hermes_IOS-unsigned.ipa Payload >/dev/null
            echo "Created unsigned IPA artifact"
          else
            echo "No .app found in archive; skipping IPA packaging"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ios-build-artifacts
          path: |
            build/**/*.xcarchive
            build/**/*.ipa
          if-no-files-found: warn
