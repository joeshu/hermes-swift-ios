name: Build iOS IPA
run-name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build simulator
        run: |
          set +e
          mkdir -p build
          xcodebuild \
            -project Hermes_IOS.xcodeproj \
            -scheme Hermes_IOS \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/build-sim.log
          echo "$?" > build/sim-exit-code.txt
          exit 0

      - name: Archive app (unsigned)
        run: |
          set +e
          mkdir -p build
          xcodebuild \
            -project Hermes_IOS.xcodeproj \
            -scheme Hermes_IOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Hermes_IOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee build/archive.log
          echo "$?" > build/archive-exit-code.txt
          exit 0

      - name: Create unsigned IPA from archive if possible
        run: |
          set +e
          mkdir -p build/Payload
          APP_PATH=$(find build/Hermes_IOS.xcarchive -type d -name '*.app' | head -n 1 || true)
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            cp -R "$APP_PATH" build/Payload/
            (cd build && zip -r Hermes_IOS-unsigned.ipa Payload >/dev/null)
            echo created > build/ipa-status.txt
          else
            echo missing-app > build/ipa-status.txt
          fi
          exit 0

      - name: Extract summaries
        if: always()
        run: |
          grep -nE "error:|fatal error:|SwiftCompile|Command .* failed|BUILD FAILED|No such module|provision|sign" build/build-sim.log | tail -n 120 > build/sim-errors.txt || true
          grep -nE "error:|fatal error:|SwiftCompile|Command .* failed|BUILD FAILED|No such module|provision|sign" build/archive.log | tail -n 120 > build/archive-errors.txt || true
          tail -n 200 build/build-sim.log > build/build-sim-tail.log || true
          tail -n 200 build/archive.log > build/archive-tail.log || true

      - name: Upload logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-artifacts
          path: |
            build/
