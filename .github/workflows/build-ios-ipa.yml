name: Build iOS IPA
run-name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: |
          set +e
          mkdir -p build
          xcodebuild \
            -project Hermes_IOS.xcodeproj \
            -scheme Hermes_IOS \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/build.log
          echo "EXIT: $?" | tee build/exit-code.txt

      - name: Extract error summary
        if: always()
        run: |
          grep -nE "error:|fatal error:|SwiftCompile|Command .* failed|BUILD FAILED|No such module" build/build.log | tail -n 200 | tee build/errors.txt || true

      - name: Upload logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: build/
