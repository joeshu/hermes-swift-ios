name: Build iOS IPA
run-name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build simulator
        shell: bash
        run: |
          set +e
          mkdir -p build
          xcodebuild \
            -project Hermes_IOS.xcodeproj \
            -scheme Hermes_IOS \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build > build/build-sim.log 2>&1
          code=$?
          echo "$code" > build/sim-exit-code.txt
          echo "=== SIM EXIT CODE ==="
          cat build/sim-exit-code.txt
          echo "=== SIM RESULT APP ==="
          find ~/Library/Developer/Xcode/DerivedData -type d -path '*Build/Products/Release-iphonesimulator/*.app' | head -n 5 || true
          exit 0

      - name: Archive app (unsigned)
        shell: bash
        run: |
          set +e
          xcodebuild \
            -project Hermes_IOS.xcodeproj \
            -scheme Hermes_IOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Hermes_IOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive > build/archive.log 2>&1
          code=$?
          echo "$code" > build/archive-exit-code.txt
          APP_PATH=$(find build/Hermes_IOS.xcarchive -type d -name '*.app' | head -n 1 || true)
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            mkdir -p build/exported-app build/Payload
            cp -R "$APP_PATH" build/exported-app/
            cp -R "$APP_PATH" build/Payload/
            (cd build && zip -r Hermes_IOS-unsigned.ipa Payload >/dev/null)
            echo created > build/ipa-status.txt
          else
            echo missing-app > build/ipa-status.txt
          fi
          echo "=== ARCHIVE EXIT CODE ==="
          cat build/archive-exit-code.txt
          echo "=== IPA STATUS ==="
          cat build/ipa-status.txt
          echo "=== ARCHIVE EXISTS ==="
          if [ -d build/Hermes_IOS.xcarchive ]; then echo yes; else echo no; fi
          echo "=== EXPORTED APP EXISTS ==="
          if find build/exported-app -type d -name '*.app' | grep -q .; then echo yes; else echo no; fi
          echo "=== IPA EXISTS ==="
          if [ -f build/Hermes_IOS-unsigned.ipa ]; then echo yes; else echo no; fi
          echo "=== FILE SIZES ==="
          [ -d build/Hermes_IOS.xcarchive ] && du -sh build/Hermes_IOS.xcarchive || true
          [ -d build/exported-app ] && du -sh build/exported-app || true
          [ -f build/Hermes_IOS-unsigned.ipa ] && ls -lh build/Hermes_IOS-unsigned.ipa || true
          echo "=== ARCHIVE ERROR SUMMARY ==="
          grep -nE "error:|fatal error:|SwiftCompile|Command .* failed|BUILD FAILED|No such module|provision|sign" build/archive.log | tail -n 120 || true
          echo "=== ARCHIVE LOG TAIL ==="
          tail -n 120 build/archive.log || true
          exit 0

      - name: Upload raw outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-outputs
          path: |
            build/Hermes_IOS.xcarchive
            build/exported-app
            build/Hermes_IOS-unsigned.ipa
            build/*.txt
            build/*.log
          if-no-files-found: warn
